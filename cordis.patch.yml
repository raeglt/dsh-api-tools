# dsh-api-tools：把接口集合（spec 文件）注册成 DSH 工具。
# specFile 相对 $DSH_HOME，默认 <DSH_HOME>/api-tools/apis.json；也可写绝对路径。
- insert:
    - id: api-tools
      name: dsh-api-tools
      config:
        specFile: api-tools/apis.json
        # 统一前缀：注册出的工具名形如 api_tool_<网关>_<工具>。这样一整族工具
        # 在外部工具管理器（如渐进式发现插件）里能用一条 `api_tool_*` 规则覆盖。
        # 想恢复旧名字（<网关>_<工具>）把这里删掉或设为空字符串即可。
        toolPrefix: api_tool
        timeoutMs: 30000
        maxResponseChars: 8000
        watch: true
